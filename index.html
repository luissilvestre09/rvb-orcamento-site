<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF">
<title>Orçamento RVB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    --navy: #1533A3;
    --blue: #0E30CC;
    --coral: #EE003B;
    --yellow: #FFB100;
    --bg: #FFFFFF;
    --surface: #FFFFFF;
    --surface-2: #E7F3FF;
    --line: #D3E2F2;
    --text: #17171D;
    --muted: #5C6470;
    --bot-bubble: #FFFFFF;
    --bot-text: #17171D;
    --user-bubble: #1533A3;
    --user-text: #FFFFFF;
    --input-bg: #FFFFFF;
    --focus: #0E30CC;
    --wall: #E7F3FF;
    --wall-dot: #C9DDF1;
    --shadow: 0 1px 2px rgba(20,26,51,.06), 0 6px 20px rgba(20,26,51,.06);
    --font-display: "Baloo 2", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --font-body: "Baloo 2", -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  :root { color-scheme: light; }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; }
  button { font: inherit; }

  .app {
    height: 100%;
    display: flex;
    flex-direction: column;
    max-width: 760px;
    margin: 0 auto;
    background: var(--bg);
  }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    background: var(--surface);
    color: var(--text);
    border-bottom: 1px solid var(--line);
  }
  .topbar-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    flex: 1 1 auto; min-width: 0;
  }
  .brand img { width: 46px; height: 46px; display: block; flex: none; object-fit: contain; }
  .brand .t1 {
    font-family: var(--font-display); font-weight: 700; font-size: 18px; line-height: 1.1;
    color: var(--text);
  }
  .brand .t2 { font-size: 13px; color: var(--muted); line-height: 1.2; font-weight: 500; }
  .stepinfo {
    font-size: 13px; color: var(--muted); font-weight: 600;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .stepinfo b { color: var(--blue); font-weight: 700; }
  @media (max-width: 430px) {
    .brand .t1 { font-size: 16px; }
    .brand .t2 { font-size: 12px; }
    .brand img { width: 40px; height: 40px; }
    .stepinfo { font-size: 12px; }
    .topbar-row { gap: 8px; padding: 8px 12px; }
  }
  .track { height: 4px; background: var(--surface-2); }
  .track .fill {
    height: 100%; width: 0;
    background: var(--yellow);
    transition: width .35s ease;
  }
  @media (prefers-reduced-motion: reduce) { .track .fill { transition: none; } }

  /* ---------- Chat ---------- */
  .chat {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 20px 16px 12px;
    background-color: var(--wall);
    background-image: radial-gradient(var(--wall-dot) 1px, transparent 1.2px);
    background-size: 18px 18px;
    display: flex; flex-direction: column; gap: 10px;
    scroll-behavior: smooth;
  }
  @media (prefers-reduced-motion: reduce) { .chat { scroll-behavior: auto; } }

  .row { display: flex; gap: 10px; align-items: flex-start; max-width: 100%; }
  .row.bot { justify-content: flex-start; }
  .row.user { justify-content: flex-end; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%; flex: none;
    background: var(--surface); color: #fff; border: 1px solid var(--line);
    display: grid; place-items: center;
    box-shadow: var(--shadow);
  }
  .avatar img { width: 26px; height: 26px; object-fit: contain; }
  .avatar.foto img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; }
  .brand img.foto { border-radius: 50%; object-fit: cover; border: 2px solid var(--yellow); }

  .bubble {
    position: relative;
    max-width: min(80%, 560px);
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.5;
    box-shadow: var(--shadow);
    animation: pop .22s ease-out;
    overflow-wrap: anywhere;
  }
  @media (prefers-reduced-motion: reduce) { .bubble { animation: none; } }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .row.bot .bubble { background: var(--bot-bubble); color: var(--bot-text); border-top-left-radius: 4px; }
  .row.user .bubble { background: var(--user-bubble); color: var(--user-text); border-top-right-radius: 4px; font-weight: 500; }
  .row.bot .bubble::before, .row.user .bubble::before {
    content: ''; position: absolute; top: 0; width: 0; height: 0;
    border-style: solid;
  }
  .row.bot .bubble::before { left: -8px; border-width: 0 8px 10px 0; border-color: transparent var(--bot-bubble) transparent transparent; }
  .row.user .bubble::before { right: -8px; border-width: 0 0 10px 8px; border-color: transparent transparent transparent var(--user-bubble); }
  .bubble b { font-weight: 700; }

  .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing i {
    width: 7px; height: 7px; border-radius: 50%; background: var(--muted); opacity: .5;
    animation: blink 1s infinite;
  }
  .typing i:nth-child(2) { animation-delay: .15s; }
  .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%,100% { opacity: .25; } 50% { opacity: .9; } }

  /* ---------- Summary card ---------- */
  .card {
    align-self: stretch;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    margin: 6px 0 4px 46px;
    box-shadow: var(--shadow);
  }
  @media (max-width: 480px) { .card { margin-left: 0; } }
  .card-head {
    background: var(--navy); color: #fff;
    padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .card-head h3 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 18px; line-height: 1.2; color: #fff; }
  .card-head span { font-size: 12px; opacity: .85; }
  .pill {
    display: inline-block; padding: 3px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600; letter-spacing: .3px;
    background: var(--yellow); color: #17171D;
  }
  .pill.p4 { background: var(--surface-2); color: var(--text); }
  .card dl {
    margin: 0; padding: 12px 16px;
    display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px;
    font-size: 14px;
  }
  .card dt { color: var(--muted); font-weight: 500; }
  .card dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }
  .card .signals {
    border-top: 1px solid var(--line);
    padding: 12px 16px; font-size: 13px; color: var(--muted);
  }
  .card .signals b { color: var(--text); font-weight: 600; }
  .card .signals ul { margin: 6px 0 0; padding-left: 18px; }
  .card .signals li { margin: 2px 0; }

  /* ---------- Dock (input area) ---------- */
  .dock {
    flex: none;
    padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    background: var(--bg);
    border-top: 1px solid var(--line);
  }
  .dock-inner { display: flex; flex-direction: column; gap: 8px; }
  .label {
    font-size: 13px; font-weight: 600; color: var(--muted);
    padding-left: 4px;
  }
  .field {
    display: flex; align-items: center; gap: 10px;
  }
  .inpwrap {
    flex: 1 1 auto; min-width: 0;
    display: flex; align-items: center; gap: 8px;
    border: 2px solid var(--line);
    background: var(--input-bg);
    border-radius: 24px;
    padding: 0 18px;
    box-shadow: var(--shadow);
    transition: border-color .15s, box-shadow .15s;
  }
  .inpwrap:focus-within { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
  .inpwrap .prefix {
    flex: none; display: inline-flex; align-items: center; gap: 6px;
    font-weight: 600; color: var(--text); font-size: 16px;
    padding-right: 10px; border-right: 1px solid var(--line);
  }
  .inpwrap .prefix .flag { font-size: 20px; line-height: 1; }
  .ddi {
    flex: none; position: relative; display: inline-flex; align-items: center; gap: 4px;
    padding-right: 10px; border-right: 1px solid var(--line); cursor: pointer;
    font-weight: 600; color: var(--text); font-size: 16px; white-space: nowrap;
  }
  .ddi .flag { font-size: 20px; line-height: 1; }
  .ddi .chev { width: 14px; height: 14px; color: var(--muted); }
  .ddi select {
    position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
    font-size: 16px; /* evita zoom no iOS */
  }
  .ddi:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
  .inpwrap .wa { flex: none; width: 22px; height: 22px; color: #25D366; }
  .field input {
    flex: 1 1 auto; min-width: 0; width: 100%;
    border: 0; outline: 0; background: transparent;
    font: inherit; font-size: 17px; color: var(--text);
    padding: 13px 0;
  }
  .field input::placeholder { color: var(--muted); opacity: .8; }
  .send {
    flex: none; width: 50px; height: 50px; border-radius: 50%;
    border: 0; background: var(--coral); color: #fff;
    display: grid; place-items: center; cursor: pointer;
    box-shadow: 0 4px 12px rgba(238,0,59,.3);
    transition: transform .1s, opacity .15s, box-shadow .15s;
  }
  .send:hover { transform: scale(1.05); }
  .send:disabled { opacity: .35; cursor: default; transform: none; box-shadow: none; }
  .send:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .send svg { width: 22px; height: 22px; margin-left: 2px; }
  .hint { font-size: 12px; color: var(--muted); padding-left: 4px; min-height: 1.2em; }
  .hint.err { color: var(--coral); font-weight: 500; }

  .choices { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-start; }
  .choice {
    border: 2px solid var(--blue); background: var(--surface); color: var(--blue);
    border-radius: 999px; padding: 9px 18px; font-weight: 700; font-size: 15px;
    cursor: pointer; box-shadow: var(--shadow);
    transition: background .12s, color .12s, transform .1s;
  }
  .choice:hover { background: var(--blue); color: #fff; border-color: var(--blue); }
  .choice:active { transform: scale(.97); }
  .choice:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .choice.quiet { border-color: var(--line); color: var(--muted); background: var(--surface); }
  .choice.quiet:hover { background: var(--surface-2); color: var(--text); }

  .cta {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    background: #25D366; color: #06281A; text-decoration: none;
    border-radius: 999px; padding: 14px 22px; font-weight: 600; font-size: 16px;
    box-shadow: var(--shadow);
  }
  .cta svg { width: 22px; height: 22px; }
  .restart {
    background: none; border: 0; color: var(--muted); cursor: pointer;
    font-size: 13px; text-decoration: underline; padding: 6px;
  }
  .foot {
    font-size: 11px; color: var(--muted); text-align: center; line-height: 1.4;
  }
  .foot a { color: inherit; }
  .proto {
    font-size: 11px; color: var(--muted); text-align: center;
    padding: 6px 16px 0; letter-spacing: .04em;
  }
  .proto code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; }

  /* ---------- Painel de distribuição (protótipo) ---------- */
  .gear {
    background: var(--surface-2); border: 0; color: var(--muted); width: 36px; height: 36px;
    border-radius: 50%; display: grid; place-items: center; cursor: pointer; flex: none;
  }
  .gear:hover { color: var(--text); }
  .gear:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .gear svg { width: 20px; height: 20px; }
  .panel {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(10,42,107,.45);
    display: flex; align-items: flex-end; justify-content: center;
    padding: 16px;
  }
  .panel-box {
    width: 100%; max-width: 520px;
    background: var(--surface); color: var(--text);
    border-radius: 18px; box-shadow: var(--shadow);
    padding: 18px 18px calc(18px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; gap: 14px;
  }
  .panel-box h2 { margin: 0; font-family: var(--font-display); font-size: 20px; font-weight: 700; line-height: 1.2; }
  .panel-box p { margin: 0; font-size: 13px; color: var(--muted); }
  .crow {
    display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 12px;
    padding: 10px 0; border-top: 1px solid var(--line);
  }
  .crow .nm { font-weight: 600; }
  .crow .ph { font-size: 12px; color: var(--muted); }
  .crow select { font: inherit; font-size: 14px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--input-bg); color: var(--text); }
  .switch { position: relative; width: 48px; height: 28px; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch span {
    position: absolute; inset: 0; border-radius: 999px; background: var(--line); cursor: pointer; transition: background .15s;
  }
  .switch span::after {
    content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%;
    background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.3);
  }
  .switch input:checked + span { background: #25D366; }
  .switch input:checked + span::after { transform: translateX(20px); }
  .switch input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }
  .queue { font-size: 13px; color: var(--muted); }
  .queue b { color: var(--text); }
  .panel-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .btn {
    border-radius: 999px; padding: 10px 18px; font-weight: 700; font-size: 14px; cursor: pointer;
    border: 2px solid var(--blue); background: var(--blue); color: #fff;
  }
  .btn.ghost { background: transparent; color: var(--blue); }
</style>
</head>

    const payload = (extra) => Object.assign({
      session_id: L.session_id, nome: L.nome, whatsapp: L.whatsapp ? L.whatsapp.replace(/\D/g, '') : undefined, ddi: L.ddi || '55', empresa: L.empresa, email: L.email,
      produto_id: L.produto ? L.produto.id : null, produto_nome: L.produto ? L.produto.label : null,
      objetivo: L.objetivo ? L.objetivo.id : undefined, objetivo_label: L.objetivo ? L.objetivo.label : undefined, detalhe: L.detalhe,
      quando: L.quando ? L.quando.id : undefined, quando_label: L.quando ? L.quando.label : undefined, data_evento: L.data || null,
      cnpj: L.cnpj, razao_social: L.razao, cidade_cnpj: L.cidadeCnpj, cidade_uso: L.cidade,
      origem_url: L.origem.url, origem_pagina: L.origem.pagina, utms: L.origem.utms
    }, extra || {});
    const salvar = (passo, extra) => api('salvar-passo', payload(Object.assign({ passo }, extra || {})));
    const prodLabel = L.produto ? L.produto.label : null;
    const prodTxt = L.produto ? L.produto.label : 'inflável';

    /* consultora definida na abertura (rodízio no servidor; simulação local no protótipo) */
    let D, C;
    const r0 = await salvar(0, { distribuir: true });
    if (r0 && r0.ok && r0.consultora && r0.consultora.id !== 'central') {
      C = { id: r0.consultora.id, nome: r0.consultora.nome, fone: fmtWa(r0.consultora.whatsapp), wa: r0.consultora.whatsapp, foto: r0.consultora.foto || null };
      D = { c: C, motivo: r0.motivo || 'rodízio (servidor)' };
    } else { D = distribuir(''); C = D.c; }
    L.dist = D;
    if (C !== CENTRAL) await definirConsultora(C.nome, C.foto || null);
    const quem = C === CENTRAL ? 'Aqui é a <b>RVB Balões</b>.' : 'Eu sou a <b>' + esc(C.nome) + '</b>, da RVB Balões.';
    if (L.produto) {
      await bot('Oi! ' + quem + ' Vi que você está buscando um <b>' + esc(prodLabel) + '</b>. Em menos de 2 minutos eu anoto o essencial do seu projeto e já sigo com você no WhatsApp sabendo do que se trata.', 900);
    } else {
      await bot('Oi! ' + quem + ' Em menos de 2 minutos eu anoto o essencial do seu projeto e já sigo com você no WhatsApp sabendo do que se trata.', 900);
    }
    await bot('Para começar, qual é o seu nome?', 600);

    setStep(1);
    L.nome = await askText({ label: 'Nome completo', placeholder: 'Seu nome', autocomplete: 'name' });
    user(L.nome); salvar(1);
    const nome = firstName(L.nome);

    setStep(2);
    await bot('Prazer, <b>' + esc(nome) + '</b>! Qual é o seu WhatsApp? É por ele que a consultora te chama.');
    DDI = '55';
    L.whatsapp = await askText({ label: 'WhatsApp', placeholder: '(11) 99999-9999', type: 'tel', inputmode: 'numeric', autocomplete: 'tel-national', mask: maskFone, validate: validFone,
      prefix: seletorPais() + WA_ICON.replace('<svg ', '<svg class="wa" ') });
    L.ddi = DDI;
    user((DDI === '55' ? '' : '+' + DDI + ' ') + L.whatsapp);
    L.regiao = DDI === '55' ? (REGIAO[ddd(L.whatsapp)[0]] || 'a confirmar') : 'exterior (+' + DDI + ')';
    /* o WhatsApp é conhecido: se a pessoa já fala com alguém da RVB, a consultora passa a conversa para ela */
    const rs = await salvar(2, { verificar_conta: true });
    let trocaPara = null;
    if (rs && rs.ok && rs.trocou && rs.consultora) {
      trocaPara = { id: rs.consultora.id, nome: rs.consultora.nome, fone: fmtWa(rs.consultora.whatsapp), wa: rs.consultora.whatsapp, foto: rs.consultora.foto || null };
    } else if (!rs) {
      const dona = BASE_EXISTENTE[digits(L.whatsapp).slice(-8)];
      if (dona && dona !== C.id) { const t = CFG.team.find(x => x.id === dona); trocaPara = { id: t.id, nome: t.nome, fone: t.fone, wa: t.wa, foto: null }; }
    }
    const conhecido = rs && rs.ok ? rs.conhecido : null;
    if (trocaPara) {
      const anterior = C.nome;
      await bot('Ah, você já fala com a <b>' + esc(trocaPara.nome) + '</b> aqui na RVB! Vou passar para ela continuar com você.');
      C = trocaPara; D = { c: C, motivo: (rs && rs.motivo) || ('pessoa já na base → ' + C.nome) }; L.dist = D;
      await definirConsultora(C.nome, C.foto || null);
      await bot('Oi, <b>' + esc(nome) + '</b>! Aqui é a <b>' + esc(C.nome) + '</b>. Que bom falar com você de novo. A ' + esc(anterior) + ' me passou o que você já contou, sigo daqui.', 700);
    } else if (conhecido) {
      await bot('Que bom falar com você de novo, <b>' + esc(nome) + '</b>!', 500);
    }


    setStep(3);
    /* pessoa conhecida com empresa no Pipedrive: só confirma; senão pergunta */
    L.empresa = null;
    if (conhecido && conhecido.empresa) {
      await bot('Você continua na <b>' + esc(conhecido.empresa) + '</b>?');
      const ok = await askChoice([{ id: 'sim', label: 'Sim' }, { id: 'nao', label: 'Não, é outra empresa', quiet: true }]);
      user(ok.label);
      if (ok.id === 'sim') L.empresa = conhecido.empresa;
    }
    if (!L.empresa) {
      await bot(conhecido && conhecido.empresa ? 'Sem problema. Qual é o nome da empresa agora?' : 'Perfeito. E qual é o nome da sua empresa?');
      L.empresa = await askText({ label: 'Empresa', placeholder: 'Nome da empresa', autocomplete: 'organization' });
      user(L.empresa);
    }
    salvar(3);

    setStep(4);
    if (L.produto) await bot('Legal, <b>' + esc(nome) + '</b>! E esse <b>' + esc(prodLabel) + '</b> será usado principalmente em qual tipo de ação?');
    else await bot('Legal, <b>' + esc(nome) + '</b>! Para eu orientar certo: o inflável será usado principalmente em qual tipo de ação?');
    L.objetivo = await askChoice(OBJECTIVES);
    user(L.objetivo.label); salvar(4);

    /* adaptações por produto (núcleo comum + uma pergunta específica) */
    if (L.produto && L.produto.id === 'replica') {
      await bot('E o que você gostaria de reproduzir? Pode ser uma embalagem, uma garrafa, um produto, o que vier à cabeça.');
      L.detalhe = await askText({ label: 'O que reproduzir', placeholder: 'Ex.: lata de 350 ml da nossa marca' });
      user(L.detalhe);
    } else if (L.produto && L.produto.id === 'tenda') {
      await bot('E onde a tenda vai ser usada?');
      const t = await askChoice(TENDA_USO); L.detalhe = t.label; user(t.label);
    }

    setStep(5);
    const whenQ = L.objetivo.id === 'evento'     ? 'E quando será o evento?' :
                  L.objetivo.id === 'inaug'      ? 'Quando será a inauguração ou a ação?' :
                  L.objetivo.id === 'promo'      ? 'Quando será a ação?' :
                  L.objetivo.id === 'recorrente' ? 'Quando você pretende começar a usar?' :
                                                   'Para quando você precisa?';
    await bot(whenQ);
    const w = await askChoice(WHEN);
    user(w.label); L.quando = w; salvar(5);
    if (w.id === 'data') {
      await bot('Qual é a data?', 400);
      L.data = await askDate({ label: 'Data do evento ou do uso' });
      user(fmtDate(L.data)); salvar(5);
      L.dias = daysUntil(L.data);
      if (L.dias <= 25) {
        await bot('Anotado: <b>' + fmtDate(L.data) + '</b>. Como a data está próxima, ' + (C === CENTRAL ? 'a equipe vai validar' : 'vou validar') + ' produção e entrega com a fábrica antes de confirmar a viabilidade.');
      } else {
        await bot('Anotado: <b>' + fmtDate(L.data) + '</b>. ' + (C === CENTRAL ? 'A equipe vai' : 'Vou') + ' considerar essa data na proposta e na programação de produção e entrega.');
      }
    } else if (w.id === '15') {
      await bot('Anotado. Como é para os próximos dias, ' + (C === CENTRAL ? 'a equipe vai validar' : 'vou validar') + ' produção e entrega com a fábrica antes de confirmar a viabilidade.');
    }

    setStep(6);
    await bot('Quase lá. Para ' + (C === CENTRAL ? 'a equipe' : 'eu') + ' preparar a cotação com os dados corretos da empresa, qual é o CNPJ?');
    let cnpjOk = false;
    while (!cnpjOk) {
      const c = await askText({ label: 'CNPJ', placeholder: '00.000.000/0001-00', inputmode: 'numeric', mask: maskCnpj, validate: validCnpj, skip: 'Não tenho agora' });
      if (c === null) { user('Não tenho agora'); L.cnpj = null; cnpjOk = true; salvar(6); break; }
      user(c);
      await bot('Só um instante, consultando…', 300);
      const rc = await api('consultar-cnpj', { cnpj: c.replace(/\D/g, ''), session_id: L.session_id });
      let razao, cidadeCnpj;
      if (rc && rc.ok) { razao = rc.razao_social; cidadeCnpj = rc.cidade_cnpj; }
      else if (rc && rc.nao_encontrado) {
        const last0 = chat.lastElementChild.querySelector('.bubble');
        last0.innerHTML = 'Não encontrei esse CNPJ na Receita. Confere o número e digita de novo, ou pula por enquanto.';
        continue;
      } else {
        /* protótipo ou falha na consulta: simula com o nome informado e a cidade do DDD */
        await wait(700);
        razao = L.empresa.replace(/\s+(ltda\.?|me|eireli|s\.?a\.?)$/i, '') + ' Ltda.';
        cidadeCnpj = DDD_CIDADE[ddd(L.whatsapp)] || 'São Paulo/SP';
      }
      const last = chat.lastElementChild.querySelector('.bubble');
      last.innerHTML = 'Encontrei: <b>' + esc(razao) + '</b>, de <b>' + esc(cidadeCnpj) + '</b>. É essa empresa mesmo?';
      const ok = await askChoice([{ id: 'sim', label: 'Confirmo' }, { id: 'nao', label: 'Não é essa', quiet: true }]);
      user(ok.label);
      if (ok.id === 'sim') { L.cnpj = c; L.razao = razao; L.cidadeCnpj = cidadeCnpj; cnpjOk = true; salvar(6); }
      else await bot('Sem problema, confere o número e digita de novo.', 300);
    }

    setStep(7);
    const usoTxt = L.objetivo.id === 'evento' ? 'O evento será' : (L.objetivo.id === 'inaug' ? 'A inauguração será' : 'O uso será');
    const cidadeQ = L.objetivo.id === 'evento' ? 'Em qual cidade e estado será o evento?' :
                    L.objetivo.id === 'inaug'  ? 'Em qual cidade e estado será a inauguração?' :
                                                 'Em qual cidade e estado o ' + prodTxt + ' vai ser usado?';
    if (L.cidadeCnpj) {
      await bot(usoTxt + ' em <b>' + esc(L.cidadeCnpj) + '</b> mesmo?');
      const m = await askChoice([{ id: 'sim', label: 'Sim' }, { id: 'nao', label: 'Não, será em outra cidade' }]);
      user(m.label);
      if (m.id === 'sim') L.cidade = L.cidadeCnpj;
      else {
        await bot(cidadeQ, 400);
        L.cidade = await askText({ label: 'Cidade / UF', placeholder: 'Ex.: Recife/PE', autocomplete: 'address-level2' });
        user(L.cidade);
      }
    } else {
      await bot(cidadeQ);
      L.cidade = await askText({ label: 'Cidade / UF', placeholder: 'Ex.: Recife/PE', autocomplete: 'address-level2' });
      user(L.cidade);
    }
    salvar(7);

    setStep(8);
    await bot('Por último, quer deixar um <b>e-mail</b>? Assim a proposta também chega na sua caixa de entrada. Se preferir, pode pular.');
    const em = await askText({ label: 'E-mail (opcional)', placeholder: 'voce@empresa.com.br', type: 'email', inputmode: 'email', autocomplete: 'email', validate: validEmail, skip: 'Pular' });
    if (em === null) { user('Pular'); L.email = null; } else { user(em); L.email = em; }
    L.convertidoEm = new Date();

    /* finalização: cria tudo no Pipedrive e confirma a consultora */
    const rf = await api('finalizar-lead', payload({ passo: 8 }));
    if (rf && rf.ok && rf.consultora) {
      if (rf.central) C = CENTRAL;
      else C = { id: rf.consultora.id, nome: rf.consultora.nome, fone: fmtWa(rf.consultora.whatsapp), wa: rf.consultora.whatsapp };
      L.dist = { c: C, motivo: rf.distribuicao || L.dist.motivo }; L.negocioId = rf.negocio_id;
    } else if (rf && !rf.ok) { C = CENTRAL; L.dist = { c: C, motivo: 'falha no servidor, lead gravado para reprocessar: ' + (rf.erro || '') }; }

    /* ---------- Closing ---------- */
    const objTxt = L.objetivo.id === 'evento' ? 'um evento, feira ou exposição' :
                   L.objetivo.id === 'inaug'  ? 'uma inauguração ou ação de loja' :
                   L.objetivo.id === 'promo'  ? 'uma ação promocional' :
                   L.objetivo.id === 'recorrente' ? 'uso recorrente' : 'o seu projeto';
    const whenTxt = L.data ? ' no dia <b>' + fmtDate(L.data) + '</b>' : (L.quando.id === 'semdata' ? ', ainda sem data definida' : ', previsto para ' + L.quando.label.toLowerCase().replace('nos ', 'os ').replace('entre ', ''));
    await bot('Pronto, <b>' + esc(nome) + '</b>! Resumindo: você está buscando um <b>' + esc(prodTxt) + '</b> para ' + objTxt + ', com uso em <b>' + esc(L.cidade) + '</b>' + whenTxt + '.');
    if (C === CENTRAL) {
      await bot('A equipe da <b>RVB</b> vai continuar seu atendimento pelo WhatsApp, já com as principais informações do projeto. Se quiser adiantar a conversa, é só chamar pelo botão abaixo.');
    } else {
      await bot('Vou continuar seu atendimento pelo WhatsApp, já com as principais informações do projeto. Se quiser adiantar a conversa, é só me chamar pelo botão abaixo.');
    }

    if (PROTOTIPO || TESTE || /debug/.test(location.hash)) renderCard(L);

    const msg = encodeURIComponent('Oi' + (C === CENTRAL ? '' : ', ' + C.nome) + '! Sou ' + nome + ', da ' + L.empresa + '. Acabei de preencher o orçamento' + (L.produto ? ' de ' + L.produto.label : '') + ' no site da RVB.');
    dock.innerHTML =
      '<div class="choices"><a class="cta" href="https://wa.me/' + C.wa + '?text=' + msg + '" target="_blank" rel="noopener">' + WA_ICON + (C === CENTRAL ? 'Falar com a RVB no WhatsApp' : 'Falar com a ' + C.nome + ' no WhatsApp') + '</a></div>' +
      '<div class="foot">WhatsApp oficial da RVB: ' + C.fone + ' · <button type="button" class="restart" id="restart">Recomeçar</button></div>';
    document.getElementById('restart').addEventListener('click', run);
    scrollDown();
  }

  function renderCard(L) {
    const p1 = !!L.data || L.quando.id === '15';
    const prioTxt = L.data ? 'P1 · evento ' + fmtDate(L.data) : (L.quando.id === '15' ? 'P1 · próximos 15 dias' : 'P4 · sem data');
    const sinais = [];
    if (L.data) sinais.push('Data marcada em ' + L.dias + ' dias: fazer a conta produção (9 a 11 dias úteis) + frete para ' + L.regiao + ' e devolver até quando precisa aprovar o layout. Nada foi prometido ao cliente sobre prazo.');
    if (L.quando.id === 'semdata') sinais.push('Sem data: perguntar o uso e a data na primeira mensagem, o campo do formulário não prioriza.');
    if (L.cnpj) sinais.push('Informou CNPJ: conferir IE e UF para condição fiscal (interno, o cliente não viu nada disso); sinal de intenção acima da média.');
    else sinais.push('Não informou CNPJ: pedir com motivo na hora de formalizar a proposta, não antes.');
    if (L.cidadeCnpj && L.cidade !== L.cidadeCnpj) sinais.push('Cidade do evento (' + L.cidade + ') é diferente da cidade do CNPJ (' + L.cidadeCnpj + '): conferir endereço de entrega e frete.');
    if (L.objetivo.id === 'recorrente') sinais.push('Uso recorrente: perguntar se é uma unidade ou várias praças. Um pedido pode virar fornecimento.');
    if (!L.produto) sinais.push('Produto não informado (entrada geral): entender o uso antes de recomendar. Trazer foto de inflável já feito no segmento do cliente.');
    if (L.produto && L.produto.id === 'portal') sinais.push('Portal: medida é o vão livre. Se for corrida, faixas de patrocinadores e relógio de prova.');
    if (L.produto && L.produto.id === 'replica') sinais.push('Réplica: confirmar se a embalagem é quadrada (estrutura interna) e autorização se a marca for de terceiro.');
    if (!L.ddi || L.ddi === '55') sinais.push('DDD ' + ddd(L.whatsapp) + ' = ' + L.regiao + '. Conferir se a cidade de uso (' + L.cidade + ') bate com a região do telefone.');
    else sinais.push('Telefone do exterior (+' + L.ddi + '): confirmar se o uso é no Brasil e como será o faturamento.');

    const utms = Object.keys(L.origem.utms).length ? Object.entries(L.origem.utms).map(([k, v]) => k.replace('utm_', '') + '=' + v).join(' · ') : 'nenhuma na URL deste teste';
    const rows = [
      ['Produto', L.produto ? L.produto.label + (L.detalhe ? ' · ' + L.detalhe : '') : 'Não informado (entrada geral do site)'],
      ['Página de origem', L.origem.pagina],
      ['Contato', L.nome + ' · ' + (L.ddi && L.ddi !== '55' ? '+' + L.ddi + ' ' : '') + L.whatsapp + (L.email ? ' · ' + L.email : '')],
      ['Empresa', L.empresa],
      ['CNPJ', L.cnpj ? L.cnpj + ' · ' + L.razao + ' · ' + L.cidadeCnpj : 'não informado'],
      ['Objetivo', L.objetivo.label],
      ['Data', L.data ? fmtDate(L.data) + ' (' + L.dias + ' dias)' : L.quando.label],
      ['Cidade do uso', L.cidade + (L.cidadeCnpj && L.cidade === L.cidadeCnpj ? ' (mesma do CNPJ)' : '')],
      ['UTMs', utms],
      ['Conversão', L.convertidoEm.toLocaleString('pt-BR')],
      ['Negócio', 'Negócio ' + L.empresa + ' 001' + (L.data ? ' - evento ' + fmtDate(L.data) : '')],
      ['Distribuição', L.dist.motivo]
    ];
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<div class="card-head"><div><h3>O que a ' + (L.dist.c === CENTRAL ? 'equipe' : L.dist.c.nome) + ' recebe</h3><span>Pipedrive: pessoa + organização + negócio + atividade</span></div><span class="pill ' + (p1 ? 'p1' : 'p4') + '">' + esc(prioTxt) + '</span></div>' +
      '<dl>' + rows.map(r => '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>').join('') + '</dl>' +
      '<div class="signals"><b>Sinais para a consultora avaliar</b> (a etiqueta Quente/Morno/Frio fica com ela)<ul>' + sinais.map(s => '<li>' + esc(s) + '</li>').join('') + '</ul></div>';
    chat.appendChild(card);
    scrollDown();
  }

  /* ---------- Painel ---------- */
  function openPanel() {
    const box = document.createElement('div');
    box.className = 'panel'; box.id = 'panel';
    const f = fila();
    box.innerHTML = '<div class="panel-box" role="dialog" aria-label="Painel de distribuição">' +
      '<h2>Distribuição de leads</h2>' +
      '<p>Ligue ou desligue quem está atendendo agora. Peso 2 recebe o dobro de leads. Cliente que já está na base vai para a dona da conta, sem passar pelo rodízio. Na versão final este painel fica numa página protegida por senha.</p>' +
      '<div>' + CFG.team.map(t =>
        '<div class="crow"><div><div class="nm">' + esc(t.nome) + '</div><div class="ph">' + esc(t.fone) + '</div></div>' +
        '<select data-peso="' + t.id + '" aria-label="Peso de ' + esc(t.nome) + '"><option value="1"' + (t.peso === 1 ? ' selected' : '') + '>peso 1</option><option value="2"' + (t.peso === 2 ? ' selected' : '') + '>peso 2</option><option value="3"' + (t.peso === 3 ? ' selected' : '') + '>peso 3</option></select>' +
        '<label class="switch"><input type="checkbox" data-ativa="' + t.id + '"' + (t.ativa ? ' checked' : '') + '><span></span></label></div>').join('') + '</div>' +
      '<div class="queue" id="queue"></div>' +
      '<div class="panel-actions"><button type="button" class="btn ghost" id="zerar">Zerar fila</button><button type="button" class="btn" id="fechar">Salvar e voltar</button></div>' +
      '</div>';
    document.body.appendChild(box);
    const q = box.querySelector('#queue');
    function refreshQueue() {
      const f = fila();
      if (!f.length) { q.innerHTML = 'Ninguém ativa: o próximo lead vai para o <b>número central da RVB</b>.'; return; }
      const idx = CFG.contador % f.length;
      q.innerHTML = 'Fila agora: ' + f.map((t, i) => i === idx ? '<b>' + esc(t.nome) + '</b>' : esc(t.nome)).join(' → ') + ' · próxima a receber: <b>' + esc(f[idx].nome) + '</b> · leads distribuídos neste teste: ' + CFG.contador;
    }
    box.querySelectorAll('[data-ativa]').forEach(el => el.addEventListener('change', () => { CFG.team.find(t => t.id === el.dataset.ativa).ativa = el.checked; saveCfg(CFG); refreshQueue(); }));
    box.querySelectorAll('[data-peso]').forEach(el => el.addEventListener('change', () => { CFG.team.find(t => t.id === el.dataset.peso).peso = Number(el.value); saveCfg(CFG); refreshQueue(); }));
    box.querySelector('#zerar').addEventListener('click', () => { CFG.contador = 0; CFG.ultima = null; saveCfg(CFG); refreshQueue(); });
    box.querySelector('#fechar').addEventListener('click', () => box.remove());
    box.addEventListener('click', e => { if (e.target === box) box.remove(); });
    refreshQueue();
  }
  document.getElementById('gear').addEventListener('click', openPanel);
  if (!PROTOTIPO) document.getElementById('gear').hidden = true;   // fora do protótipo, quem distribui é o servidor
  if (PRODUCAO) { const pr = document.querySelector('.proto'); if (pr) pr.hidden = true; }

  run();
  window.addEventListener('hashchange', run);
})();
</script>
</body>
